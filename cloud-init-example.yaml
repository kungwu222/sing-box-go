# cloud-init 示例: sing-box 全自动部署 (经由 install.sh 一键包装脚本)
# 用法: 将本文件内容作为云厂商自定义数据 (user-data) 粘贴, 或合并到现有 cloud-config
# 注意: runcmd 已是 root 身份, 不需要 sudo

#cloud-config

runcmd:
  # 方式 A: 一条命令, 用 install.sh 内置默认参数部署
  - curl -fsSL https://raw.githubusercontent.com/kungwu222/sing-box-go/refs/heads/main/install.sh | bash

  # 方式 B: 覆盖部分参数 (二选一, 把 A 注释掉)
  # - curl -fsSL https://raw.githubusercontent.com/kungwu222/sing-box-go/refs/heads/main/install.sh | bash -s -- --reality-port 8443 --reality-sni www.apple.com

  # 查看结果 (完整日志在 /var/log/cloud-init-output.log)
  - cat /etc/sing-box/nodes.txt

# 说明:
# - runcmd 在网络就绪后执行, install.sh 里 curl 自带 3 次重试
# - 部署结果: /etc/sing-box/nodes.txt(分享链接) /etc/sing-box/deploy-result.json
# - Hy2 跳跃: iptables/nftables REDIRECT + 开机自启恢复(sb-porthopping.service)
# - 管理入口: sbgo list/nodes/info/url/qr/restart/status ...
